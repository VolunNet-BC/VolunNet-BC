<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><title>Submission status · VolunNetBC</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>:root{--bg:#FAF8F2;--s:#fff;--t:#10253d;--m:#566779;--l:#d6d0c0;--b:#0F3F73;--ok:#1b6b3a;--bad:#b3261e;--wait:#8a5a00}
@media(prefers-color-scheme:dark){:root{--bg:#081a30;--s:#0e2b4b;--t:#f4efe3;--m:#a9b9ca;--l:#2a5582;--b:#F5B03C;--ok:#7be0a0;--bad:#ff9b8f;--wait:#ffd27a;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:17px/1.55 "Source Sans 3",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 18px 60px}h1{font:700 40px/1 "Barlow Condensed","Arial Narrow",Impact,sans-serif;margin:8px 0 14px}
a{color:var(--b)}a.back{display:inline-block;padding:10px 0;min-height:44px}
.card{background:var(--s);border:1px solid var(--l);border-radius:12px;padding:16px}.pill{display:inline-block;font-weight:600;padding:4px 12px;border-radius:99px;border:2px solid currentColor;margin:6px 0}
.m{color:var(--m);font-size:15px}</style></head><body><main>
<a class="back" href="/">← Back to roles</a><h1>Submission status</h1>
<div id="v" class="card" aria-live="polite"><p>Loading…</p></div>
<p class="m">This page is only for people who have the reference. It shows your listing’s title, organization and status, and nothing else.</p></main>
<script>
var SB="https://tfzrskibboylxfhsdxwo.supabase.co",KEY="sb_publishable_ZG_CcE0Hufaz9L2BSGnHtw_7uXtE6Nl",v=document.getElementById("v");
var ref=location.pathname.split("/").filter(Boolean).pop();
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var M={pending:["Waiting for review","var(--wait)","A person or an automatic check will look at it. This can take a few days."],
published:["Live","var(--ok)","Your listing is on the site."],
rejected:["Not accepted","var(--bad)","Your listing wasn’t accepted."],
changes_requested:["Changes requested","var(--wait)","A reviewer asked for changes. Submit a corrected listing from the submit page."],
expired:["Expired","var(--m)","This listing passed its 90-day end date and is no longer shown."],
closed:["Applications closed","var(--m)","This role is marked closed."],archived:["Archived","var(--m)","This listing is no longer shown."]};
fetch(SB+"/rest/v1/rpc/get_submission_status",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({p_ref:ref})}).then(function(r){return r.json()}).then(function(j){
if(!Array.isArray(j)||!j.length){v.innerHTML="<p>We couldn’t find that reference. Check that the link is complete.</p>";return}
var s=j[0],m=M[s.status]||[s.status,"var(--m)",""];
v.innerHTML="<h2 style='margin:0 0 4px'>"+esc(s.title)+"</h2><p class='m' style='margin:0'>"+esc(s.organization)+"</p><span class='pill' style='color:"+m[1]+"'>"+esc(m[0])+"</span><p>"+esc(m[2])+"</p>"+(s.note?"<p><b>Reviewer note:</b> "+esc(s.note)+"</p>":"")+"<p class='m'>Submitted "+esc((s.submitted_at||"").slice(0,10))+"</p>"
}).catch(function(){v.innerHTML="<p>Couldn’t reach the server. Please try again.</p>"});
</script></body></html>
